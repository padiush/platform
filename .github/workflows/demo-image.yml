name: Demo image

# Publishes the evaluation image so trying Padiush costs one command and no
# clone. Built on release rather than on every push: it is a thing people run,
# not a thing that needs to track the tip of main.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Named -demo on purpose. There is no production image yet, and a bare
  # `platform` tag would be mistaken for one.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/platform-demo

jobs:
  # Each architecture builds on a runner of its own architecture and pushes an
  # untagged image identified only by digest; `merge` then joins the digests
  # into one multi-arch tag.
  #
  # The obvious shape — one job, `platforms: linux/amd64,linux/arm64` — is what
  # this replaces. It builds arm64 under QEMU on an amd64 runner, and emulating
  # `composer install`, `npm ci` and a Vite build is slow enough that the first
  # attempt was killed at the six-hour job limit having published nothing.
  # GitHub's arm64 runners are free for public repositories, so the emulation
  # buys nothing.
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Name this platform for artifact paths
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/demo/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform: a shared scope has the two jobs evicting each
          # other's layers, so neither ever gets a warm cache.
          cache-from: type=gha,scope=demo-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture digests into a single tagged manifest list, so
  # `docker run ghcr.io/…/platform-demo` resolves to whichever architecture is
  # doing the pulling.
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # `latest` is unconditional so a manual run can publish something
          # usable. Gating it on the release event left workflow_dispatch
          # producing no tags at all, which fails the push rather than
          # publishing an untagged image.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            '${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}'
