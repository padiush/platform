name: padiush

services:
    app:
        build:
            context: docker/php
        ports:
            - '8000:8000'
        volumes:
            - .:/var/www/html
        # Real environment variables take precedence over .env in Laravel,
        # so the local (non-Docker) setup keeps working unchanged.
        environment:
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mariadb
            DB_PORT: 3306
            DB_DATABASE: padiush
            DB_USERNAME: padiush
            DB_PASSWORD: padiush
            # Sessions in the database, so Mi cuenta can list and sign out
            # each browser the user is signed in on.
            SESSION_DRIVER: database
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            # SeaweedFS stands in for S3. The endpoint is localhost:9000 (its
            # published port) so the presigned URLs the app generates are
            # fetchable from the host browser. The app also calls S3 itself
            # (checking an upload landed, storing and serving media), and
            # inside this container localhost is not SeaweedFS, so the command
            # below forwards the container's own localhost:9000 to it. One
            # endpoint then works from both sides, and presigned URLs stay
            # signed for the host the browser actually uses.
            AWS_ACCESS_KEY_ID: padiush
            AWS_SECRET_ACCESS_KEY: padiush-secret
            AWS_DEFAULT_REGION: us-east-1
            AWS_BUCKET: padiush
            AWS_ENDPOINT: http://localhost:9000
            AWS_USE_PATH_STYLE_ENDPOINT: 'true'
        # --no-reload is required: without it, artisan serve strips container
        # env vars from the web process (only a small passthrough list
        # survives), so the DB/S3 overrides above would never apply.
        # Trade-off: after editing .env, run `docker compose restart app`.
        command: sh -c "socat TCP-LISTEN:9000,bind=127.0.0.1,fork,reuseaddr TCP:seaweedfs:9000 & composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
        depends_on:
            mariadb:
                condition: service_healthy

    node:
        image: node:22-alpine
        working_dir: /var/www/html
        environment:
            VITE_DOCKER: 1
        volumes:
            - .:/var/www/html
            # Overlay so Linux binaries don't clash with the host's node_modules
            - node_modules:/var/www/html/node_modules
        ports:
            - '5173:5173'
        command: sh -c "npm install && npm run dev"

    mariadb:
        image: mariadb:11.8
        environment:
            MARIADB_DATABASE: padiush
            MARIADB_USER: padiush
            MARIADB_PASSWORD: padiush
            MARIADB_ROOT_PASSWORD: root
        ports:
            # 3307 on the host to avoid clashing with a local MySQL on 3306
            - '3307:3306'
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 12

    mailpit:
        image: axllent/mailpit
        ports:
            - '8025:8025'

    # SeaweedFS stands in for S3: MinIO's open-source edition is archived and
    # its images are no longer published. `weed mini` runs the whole store in
    # one process; the AWS_* variables become its admin identity, so the app's
    # credentials below are the ones it accepts, and -bucket creates the
    # bucket on first start. The other components it can run are switched off.
    seaweedfs:
        image: chrislusf/seaweedfs:4.48
        command: >
            mini -dir=/data -s3.port=9000 -bucket=padiush
            -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
        environment:
            AWS_ACCESS_KEY_ID: padiush
            AWS_SECRET_ACCESS_KEY: padiush-secret
        ports:
            - '9000:9000'
        volumes:
            - seaweedfs_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-fs', 'http://localhost:9000/healthz']
            interval: 5s
            timeout: 5s
            retries: 12

    # One-shot: uploads the placeholder images the public/auth pages expect.
    # Safe to re-run; exits when done.
    s3-setup:
        image: amazon/aws-cli
        depends_on:
            seaweedfs:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: padiush
            AWS_SECRET_ACCESS_KEY: padiush-secret
            AWS_DEFAULT_REGION: us-east-1
        volumes:
            - ./docker/s3/seed:/seed:ro
        command: >
            --endpoint-url http://seaweedfs:9000
            s3 cp --recursive --only-show-errors /seed/ s3://padiush/

volumes:
    mariadb_data:
    seaweedfs_data:
    node_modules:
