name: padiush

services:
    app:
        build:
            context: docker/php
        ports:
            - '8000:8000'
        volumes:
            - .:/var/www/html
        # Real environment variables take precedence over .env in Laravel,
        # so the local (non-Docker) setup keeps working unchanged.
        environment:
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mariadb
            DB_PORT: 3306
            DB_DATABASE: padiush
            DB_USERNAME: padiush
            DB_PASSWORD: padiush
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            # MinIO stands in for S3. The endpoint is localhost:9000 (MinIO's
            # published port) so the presigned URLs the app generates are
            # fetchable from the host browser. Caveat: server-side S3 API
            # calls would need http://minio:9000 instead — nothing does those
            # today (the app only generates presigned GET URLs, which is an
            # offline operation).
            AWS_ACCESS_KEY_ID: padiush
            AWS_SECRET_ACCESS_KEY: padiush-secret
            AWS_DEFAULT_REGION: us-east-1
            AWS_BUCKET: padiush
            AWS_ENDPOINT: http://localhost:9000
            AWS_USE_PATH_STYLE_ENDPOINT: 'true'
        # --no-reload is required: without it, artisan serve strips container
        # env vars from the web process (only a small passthrough list
        # survives), so the DB/MinIO overrides above would never apply.
        # Trade-off: after editing .env, run `docker compose restart app`.
        command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
        depends_on:
            mariadb:
                condition: service_healthy

    node:
        image: node:22-alpine
        working_dir: /var/www/html
        environment:
            VITE_DOCKER: 1
        volumes:
            - .:/var/www/html
            # Overlay so Linux binaries don't clash with the host's node_modules
            - node_modules:/var/www/html/node_modules
        ports:
            - '5173:5173'
        command: sh -c "npm install && npm run dev"

    mariadb:
        image: mariadb:11.8
        environment:
            MARIADB_DATABASE: padiush
            MARIADB_USER: padiush
            MARIADB_PASSWORD: padiush
            MARIADB_ROOT_PASSWORD: root
        ports:
            # 3307 on the host to avoid clashing with a local MySQL on 3306
            - '3307:3306'
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 12

    mailpit:
        image: axllent/mailpit
        ports:
            - '8025:8025'

    minio:
        image: minio/minio
        command: server /data --console-address ':9001'
        environment:
            MINIO_ROOT_USER: padiush
            MINIO_ROOT_PASSWORD: padiush-secret
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - minio_data:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-f',
                    'http://localhost:9000/minio/health/live',
                ]
            interval: 5s
            timeout: 5s
            retries: 12

    # One-shot: creates the bucket and uploads the placeholder images the
    # public/auth pages expect. Safe to re-run; exits when done.
    minio-setup:
        image: minio/mc
        depends_on:
            minio:
                condition: service_healthy
        volumes:
            - ./docker/minio/seed:/seed:ro
        entrypoint: >
            sh -c "mc alias set local http://minio:9000 padiush padiush-secret
            && mc mb --ignore-existing local/padiush
            && mc cp --recursive /seed/ local/padiush/"

volumes:
    mariadb_data:
    minio_data:
    node_modules:
